name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Тесты идут под Electron (ELECTRON_RUN_AS_NODE), потому что better-sqlite3
    # собран под ABI Electron. Поэтому раннер — macOS, как и целевая платформа.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
